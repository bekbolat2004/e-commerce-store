{% load static %}

<div class="card mb-3 text-bg-light shadow-lg">
        {% for basket in baskets %}
        <div class="card-header">
            <h5 class="card-title">{{ basket.product.name }}</h5>
        </div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item">
                <div class="row text-center">
                    <div class="col p-0">
                        <div class="input-group">
                            <form class="d-flex" action="{% url 'basket:basket_change' basket.id %}" method="post">
                                {% csrf_token %}
                                <input type="hidden" name="next" value="{{ request.get_full_path }}">
                                <input type="number" class="form-control number" name="quantity"
                                    value="{{ basket.quantity }}" min="1" max="{{ basket.product.quantity }}">
                                <button type="submit" class="btn btn-dark btn-sm">Обновить</button>
                            </form>
                        </div>
                    </div>
                    <div class="col p-0">
                        <p>x {{ basket.product.sell_price }} = </p>
                    </div>
                    <div class="col p-0"><strong> {{basket.products_price}} ₸</strong></div>
                    <div class="col p-0">
                        <form action="{% url 'basket:basket_remove' basket.id %}" method="post">
                            {% csrf_token %}
                            <input type="hidden" name="next" value="{{ request.get_full_path }}">
                            <button type="submit" class="btn btn-link p-0" aria-label="Удалить товар">
                                <img class="mx-1" src="{% static 'deps/icons/trash3-fill.svg' %}"
                                    alt="" width="16" height="16">
                            </button>
                        </form>
                    </div>
                </div>
            </li>
            </ul>
    {% endfor %}
</div>
<div class="card mb-3 shadow-lg">
    <div class="card-footer">
        <p class="float-left">Итого <strong>{{ baskets.total_quantity }}</strong> товар(а) на сумму</p>
        <h4 class="float-left"><strong>{{ baskets.total_price }} ₸</strong></h4>
    </div>
</div>
